<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Alumni Network Login</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('https://images.unsplash.com/photo-1523050854058-8df90110c9f1') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .overlay {
      background-color: rgba(255, 255, 255, 0.9);
      padding: 40px;
      border-radius: 15px;
      display: flex;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
      max-width: 900px;
      width: 90%;
    }

    .login-form-section {
      flex: 1;
      padding: 20px;
    }

    .image-section {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-section img {
      max-width: 100%;
      border-radius: 12px;
    }

    .login-form-section h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    form input, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      background-color: #0066cc;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #004999;
    }

    #errorMsg {
      color: red;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="image-section">
      <img src="alumni.jpg" alt="Alumni illustration">
    </div>
    <div class="login-form-section">
      <h1>Alumni Network System</h1>
      <form id="loginForm">
        <input type="text" id="username" placeholder="Username" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit">Login</button>
        <p id="errorMsg"></p>
      </form>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
